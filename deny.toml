[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 is the last 0.3 release and has no backport. typesafe-sdk 0.1.2 is the newest release and requires reqwest 0.11, which pins hyper 0.14." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 is only reachable through typesafe-sdk 0.1.2's reqwest 0.11. The patched 0.103 line is already used everywhere else." },
    { id = "RUSTSEC-2026-0099", reason = "same typesafe-sdk 0.1.2 / reqwest 0.11 pin as RUSTSEC-2026-0098" },
    { id = "RUSTSEC-2026-0104", reason = "same typesafe-sdk 0.1.2 / reqwest 0.11 pin as RUSTSEC-2026-0098" },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained with no upgrade. gpui-kit 0.6.6 pulls it into desktop." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no upgrade. gpui-kit 0.6.6 pulls it into desktop." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained with no upgrade. typesafe-sdk 0.1.2 pulls 1.0.4 through reqwest 0.11." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained with no upgrade. gpui-kit 0.6.6 pulls it into desktop." },
    { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained with no upgrade. rhai 1.26.1 pulls it into workflow-rhai." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no upgrade. gpui-kit 0.6.6 pulls it into desktop." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "0BSD",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
