name: execslice
on:
  push:
    paths:
      - .github/workflows/execslice.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply_exec.py
      - run: |
          git config user.name gol
          git config user.email gol@users.noreply.github.com
          git add Cargo.lock README.md crates/harness/src/driver.rs crates/server/tests/http_run.rs docs/architecture.md docs/harness-runtime.md
          git rm .github/workflows/execslice.yml .github/apply_exec.py
          git commit -m "feat(execution): boot reverse and box placements"
          git push
