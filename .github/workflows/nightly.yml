name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri checks unsafe code that a test executes. gol forbids unsafe in every crate but
      # workflow-bend, so Miri runs where a dependency's unsafe is gol's risk: rhai and
      # smartstring behind workflow-rhai (gol-verify ownership map, "Dependency UB").
      # workflow-core and harness-core have no dependencies. execution's tests run safe gol
      # code; the unsafe they reach is in std and general-purpose crates, not in code gol
      # owns, and only execution needed isolation off. Isolation stays on.
      - name: Miri
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo miri setup
          cargo miri test -p workflow-rhai
          # protocol: proptest terminal_state_is_stuck does not finish under Miri.
          # harness: catalog opens a socketpair of type 0x5, which Miri rejects.
          # gateway: the wiremock test returns while a server thread is still running.
          # memory: tokio-postgres setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # server: reqwest setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # proxy: reqwest setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # runtime-tokio: replay_proof calls posix_spawn, which Miri cannot execute.
          # workflow-js: boa_engine trips stacked-borrows UB inside Context::default.
          # workflow-bend: staging sources calls copy_file_range (syscall 326), which Miri cannot execute.
