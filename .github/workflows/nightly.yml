name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri checks unsafe code that a test executes. gol forbids unsafe in every crate but
      # workflow-bend, so Miri runs where a dependency's unsafe is gol's risk: rhai and
      # smartstring behind workflow-rhai (gol-verify ownership map, "Dependency UB").
      # workflow-core and harness-core have no third-party dependencies. execution's tests run safe gol
      # code; the unsafe they reach is in std and general-purpose crates, not in code gol
      # owns, and only execution needed isolation off. Isolation stays on.
      - name: Miri
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo miri setup
          cargo miri test -p workflow-rhai
          # protocol: proptest terminal_state_is_stuck does not finish under Miri.
          # harness: catalog opens a socketpair of type 0x5, which Miri rejects.
          # gateway: the wiremock test returns while a server thread is still running.
          # memory: tokio-postgres setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # server: reqwest setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # proxy: reqwest setsockopt SOL_SOCKET option 0x9, which Miri rejects.
          # runtime-tokio: replay_proof calls posix_spawn, which Miri cannot execute.
          # workflow-js: boa_engine trips stacked-borrows UB inside Context::default.
          # workflow-bend: staging sources calls copy_file_range (syscall 326), which Miri cannot execute.

  tlc-large:
    # formal/runqueue at constants past the PR budget (AGENTS.md: TLC at PR
    # constants runs on every PR, larger constants run nightly). The config is
    # made here so verify-tla.sh, which checks every formal/**/*.cfg, does not
    # pick it up. One worker: TLC 2.19 finishes this check with more, then throws
    # a division by zero in its closing statistics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install TLA+ tools
        run: ./scripts/install-tla.sh
      - name: RunQueue with three workers, two runs, two crashes and two slow leases
        working-directory: formal/runqueue
        run: |
          sed -e 's/Workers = {"w1", "w2"}/Workers = {"w1", "w2", "w3"}/' \
              -e 's/Runs = {"r1"}/Runs = {"r1", "r2"}/' \
              -e 's/MaxCrashes = 1/MaxCrashes = 2/' \
              -e 's/MaxSlow = 1/MaxSlow = 2/' \
              RunQueue.cfg > "$RUNNER_TEMP/RunQueueNightly.cfg"
          grep -q 'Runs = {"r1", "r2"}' "$RUNNER_TEMP/RunQueueNightly.cfg"
          java -XX:+UseParallelGC -jar "$HOME/.local/tla/tla2tools.jar" -workers 1 -lncheck final \
            -config "$RUNNER_TEMP/RunQueueNightly.cfg" RunQueue.tla
