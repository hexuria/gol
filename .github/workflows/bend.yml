name: bend

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run it replaces. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Keep this equal in pr.yml: the workflow-bend cache key hashes CARGO_* variables.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull_request checkout is a merge commit. Its first parent is the base.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: ./scripts/ci-scope.sh >> "$GITHUB_OUTPUT"

  bend:
    needs: scope
    # Runs unless scope says docs only. A failed scope also runs this job.
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          # The differential job in pr.yml builds the same workflow-bend test binary.
          shared-key: workflow-bend
      - name: Install Bend 2.0.28
        run: |
          ./scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Allow user namespaces for unshare
        run: |
          # verify-bend.sh runs `unshare -r -n` so bend has no network.
          # ubuntu-latest sets apparmor_restrict_unprivileged_userns=1, which
          # makes that fail with: unshare: write failed /proc/self/uid_map.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -f /etc/apparmor.d/unprivileged_userns ]; then
            sudo apparmor_parser -R /etc/apparmor.d/unprivileged_userns || true
          fi
          unshare -r -n -- true
      - name: Verify Bend
        run: ./scripts/verify-bend.sh
