name: record-lockfile
on:
  push:
    branches:
      - gol/replay-proof-kill-7fba
    paths:
      - lock.patch
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply the Rhai lockfile patch
        run: |
          set -euo pipefail
          git apply --check lock.patch
          git apply lock.patch
          echo "8ee27ec4265fe5438044efc85e10f10f326e491ebecf3a8637b925be7858aefa  Cargo.lock" | sha256sum -c -
          git add Cargo.lock
          git rm -f lock.patch
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git commit -m "Record workflow-rhai and rhai in Cargo.lock."
          git push origin HEAD:gol/replay-proof-kill-7fba
