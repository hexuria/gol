name: lockpg
on:
  push:
    paths:
      - .github/workflows/lockpg.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo generate-lockfile
      - run: |
          actual=$(git hash-object Cargo.lock)
          echo "lock $actual"
          test "$actual" = "d0b0c0098d523aa2e1b8fb230666486263338599"
      - run: |
          git config user.name gol
          git config user.email gol@users.noreply.github.com
          git add Cargo.lock
          git rm .github/workflows/lockpg.yml
          git commit -m "Record postgres and redis in Cargo.lock"
          git push
