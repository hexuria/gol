name: sync-lockfile
on:
  push:
    branches:
      - gol/surface-core-dbee
    paths:
      - .github/workflows/sync-lockfile.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Assemble Cargo.lock and drop temporary slices
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          parts = sorted(Path(".lockparts").glob("p-*"))
          names = [p.name for p in parts]
          expected = [f"p-{i:02d}" for i in range(33)]
          if names != expected:
              raise SystemExit(f"slice names {names} != {expected}")
          data = b"".join(p.read_bytes() for p in parts)
          Path("Cargo.lock").write_bytes(data)
          PY
          test "$(git hash-object Cargo.lock)" = "923d628ea9c72a8065e83269cf8c0aeed0e2b058"
          git add Cargo.lock
          git rm -r .lockparts
          git rm -f sync-fetch.log .github/workflows/sync-lockfile.yml
          git config user.email "cursoragent@cursor.com"
          git config user.name "Cursor Agent"
          git commit -m "Lock surface-core and crux_core 0.20.0."
          git push origin HEAD:refs/heads/gol/surface-core-dbee
