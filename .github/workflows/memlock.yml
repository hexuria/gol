name: memlock
on:
  push:
    paths:
      - .github/workflows/memlock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          import subprocess
          lock = Path("Cargo.lock")
          text = lock.read_text()
          needle = "[[package]]\nname = \"mime\"\n"
          insert = "[[package]]\nname = \"memory\"\nversion = \"0.1.0\"\ndependencies = [\n \"harness\",\n \"postgres\",\n \"protocol\",\n \"serde_json\",\n]\n\n"
          if "name = \"memory\"" not in text:
              if needle not in text:
                  raise SystemExit("lock anchor missing")
              lock.write_text(text.replace(needle, insert + needle, 1))
          actual = subprocess.check_output(["git", "hash-object", "Cargo.lock"], text=True).strip()
          print(actual)
          if actual != "e05a0b0fad73845ad2dcaa24a72d3f28d1d2b5c0":
              raise SystemExit("hash mismatch")
          PY
      - run: |
          git config user.name gol
          git config user.email gol@users.noreply.github.com
          git add Cargo.lock
          git rm .github/workflows/memlock.yml
          git commit -m "Record the memory crate in Cargo.lock"
          git push
