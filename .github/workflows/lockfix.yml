name: lockfix
on:
  push:
    paths:
      - .github/workflows/lockfix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply exact lockfile patch
        run: |
          set -eu
          git apply .github/lockfix.patch
          test "$(git hash-object Cargo.lock)" = "63a3be64cfe4bf0bd6a9c16bc1c24d0cd6e639b9"
          git config user.email "lockfix@users.noreply.github.com"
          git config user.name "lockfix"
          git add Cargo.lock
          git rm -f .github/lockfix.patch .github/workflows/lockfix.yml
          git commit -m "Replace Cargo.lock with exact 33fc313 bytes"
          git push
