name: catalog-lock
on:
  push:
    paths:
      - .github/workflows/catalog-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply_catalog_lock.py
      - run: |
          git config user.name gol
          git config user.email gol@users.noreply.github.com
          git add Cargo.lock
          git rm -f .github/apply_catalog_lock.py .github/apply_catalog.py .github/catalog.b64 .github/catalog-lock.yml .github/workflows/catalog-lock.yml
          git commit -m "feat(harness): record the catalog lock"
          git push
