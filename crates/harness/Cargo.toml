[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
typesafe-sdk = { version = "0.1.2", features = ["blocking"] }
uuid = "1"

[dev-dependencies]
proptest = "1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
