[package]
name = "gateway-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
gateway = { path = ".." }
protocol = { path = "../../protocol" }
libfuzzer-sys = "0.4"
serde_json = "1"

# Its own workspace: cargo-fuzz builds it with a nightly toolchain, apart
# from the main workspace.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
