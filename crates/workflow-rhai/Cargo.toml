[package]
name = "workflow-rhai"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
workflow-core = { path = "../workflow-core" }
# internals exposes on_missing_function, which makes a misuse a sticky fault.
# The hook is a volatile rhai API, so the version is pinned exactly.
rhai = { version = "=1.26.1", features = ["internals"] }
